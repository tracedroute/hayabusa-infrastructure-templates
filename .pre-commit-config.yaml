repos:
  - repo: local
    hooks:
      - id: check-iac-tree
        name: IaC tree hygiene
        entry: python3 scripts/check_iac_tree.py .
        language: system
        pass_filenames: false
      - id: smoke-iac-tree
        name: IaC smoke / wiring
        entry: python3 scripts/smoke_iac_tree.py
        language: system
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
